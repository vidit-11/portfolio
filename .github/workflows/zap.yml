name: ZAP scan

on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # baseline only, full scan would spam the contact form
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://vidit-singh-chauhan.vercel.app
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false
