name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  VERCEL_CLI_VERSION: 65.4.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  PRODUCTION_URL: https://vidit-singh-chauhan.vercel.app
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  preview:
    needs: checks
    # no secrets on fork PRs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: comment preview url
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const tag = '<!-- vercel-preview -->'
            const body = `${tag}\nPreview: ${process.env.PREVIEW_URL} (${context.payload.pull_request.head.sha.slice(0, 7)})`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const old = comments.find(c => c.body?.includes(tag))
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  production:
    needs: checks
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  smoke-test:
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: pages return 200
        run: |
          set -euo pipefail
          for path in / /projects /contact /resume.pdf /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 --retry-all-errors "$PRODUCTION_URL$path")
            echo "$code $path"
            [ "$code" = "200" ] || exit 1
          done

      - name: home page has content
        run: curl -fsS "$PRODUCTION_URL/" | grep -q "Vidit"

      - name: 404 works
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/does-not-exist")
          echo "$code"
          [ "$code" = "404" ]
